name: shopay
description: "A new Flutter project for Shopay."
publish_to: 'none'

version: 1.0.0+1

environment:
    sdk: '>=3.0.0 <4.0.0'

dependencies:
    flutter:
        sdk: flutter
    cupertino_icons: ^1.0.6
    share_plus: ^10.1.2
    confetti: ^0.7.0
    url_launcher: ^6.3.1
    firebase_core: ^3.10.1
    firebase_auth: ^5.4.1
    cloud_firestore: ^5.6.12

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^3.0.0

flutter:
    uses-material-design: true

    assets:
        - assets/images/chart_banner.png