<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Shopay</title>

    <script>
        // GitHub Pages Flutter Web SPA fallback
        const path = window.location.pathname;
        const search = window.location.search;
        const hash = window.location.hash;

        // GitHub Pages project path
        const basePath = '/shopay';

        // যদি Flutter app-এর route হয়
        if (path.startsWith(basePath)) {
          const routePath =
              path.substring(basePath.length) || '/';

          const newUrl =
              basePath + '/index.html' +
              '?route=' +
              encodeURIComponent(routePath) +
              search +
              hash;

          window.location.replace(newUrl);
        } else {
          window.location.replace(
            basePath + '/index.html' +
            search +
            hash
          );
        }
    </script>
</head>

<body>
<p>Loading Shopay...</p>
</body>
</html>
